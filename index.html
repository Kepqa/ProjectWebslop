<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f1e7" />
  <title>Webslop</title>
</head>
<body>
  <header>
    <h1>Webslop</h1>
    <p>Маленькие игрушки, в которые можно залипнуть на пять минут. Или на час.</p>
  </header>

  <main class="grid">
    <a class="card" href="./survivors/" style="--bg:#1f2a1c; --ink:#d7f0b5">
      <div class="art">
        <svg viewBox="0 0 200 120" aria-hidden="true">
          <rect width="200" height="120" fill="#24301f"/>
          <g fill="#5c7a3a"><circle cx="40" cy="80" r="9"/><circle cx="62" cy="38" r="9"/><circle cx="150" cy="30" r="9"/><circle cx="168" cy="86" r="9"/><circle cx="128" cy="96" r="9"/><circle cx="30" cy="30" r="9"/></g>
          <circle cx="100" cy="62" r="11" fill="#f2d27a"/>
          <path d="M40 100 Q100 10 175 60" stroke="#eaf7ff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>
        </svg>
      </div>
      <b>Swipe Survivors</b>
      <small>Режь орды зомби свайпами. Сюжет, волны, кооп.</small>
    </a>

    <a class="card" href="./duel/" style="--bg:#2a1730; --ink:#ffd4f0">
      <div class="art">
        <svg viewBox="0 0 200 120" aria-hidden="true">
          <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1d4a"/><stop offset="1" stop-color="#d0644a"/></linearGradient></defs>
          <rect width="200" height="120" fill="url(#sky)"/>
          <circle cx="100" cy="70" r="26" fill="#ffcf7a" opacity=".85"/>
          <rect y="96" width="200" height="24" fill="#2a1a22"/>
          <g fill="#160c14"><rect x="48" y="58" width="14" height="30" rx="5"/><circle cx="55" cy="50" r="8"/><rect x="48" y="86" width="5" height="12"/><rect x="57" y="86" width="5" height="12"/>
            <rect x="138" y="58" width="14" height="30" rx="5"/><circle cx="145" cy="50" r="8"/><rect x="138" y="86" width="5" height="12"/><rect x="147" y="86" width="5" height="12"/></g>
          <path d="M62 66 L92 52" stroke="#e8e8f0" stroke-width="4" stroke-linecap="round"/>
          <circle cx="118" cy="62" r="7" fill="#ff7b2e"/><circle cx="118" cy="62" r="3.5" fill="#fff2b0"/>
        </svg>
      </div>
      <b>Дуэль</b>
      <small>Бой один на один: удары, блоки, парирования и заклинания.</small>
      <i class="new">новое</i>
    </a>

    <div class="card soon">
      <div class="art"><span>?</span></div>
      <b>Скоро</b>
      <small>Следующая игрушка уже в мастерской.</small>
    </div>
  </main>

  <footer id="ver"></footer>
  <script type="module" src="./src/hub/hub.ts"></script>
</body>
</html>
