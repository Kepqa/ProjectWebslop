<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#151a14" />
  <title>Swipe Survivors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" />
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div class="bar hp"><div class="fill" id="hp-fill"></div><span id="hp-text"></span></div>
    <div class="stats">
      <span id="time">0:00</span>
      <span class="kills"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14 13 3M9 2.5h4.5V7"/></svg><b id="kills">0</b></span>
      <span id="fps" class="hidden"></span>
      <button id="dev-btn" class="hudbtn hidden" aria-label="Разработчик">DEV</button>
      <button id="pause" class="hudbtn" aria-label="Пауза"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg></button>
      <button id="mute" class="hudbtn" aria-label="Звук"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="spk" d="M2.5 6v4h2.5l3.5 3V3L5 6z"/><path class="on" d="M11 5.5c1.3 1.4 1.3 3.6 0 5M12.8 3.6c2.3 2.5 2.3 6.3 0 8.8"/><path class="off" d="m11 6 3.5 4M14.5 6 11 10"/></svg></button>
    </div>
    <div class="xprow"><span class="lvl">Ур. <b id="level">1</b></span><div class="bar xp"><div class="fill" id="xp-fill"></div></div></div>
    <div class="items" id="items"></div>
    <div id="scorebox"><div id="score-num" class="zero">0</div><div id="combo" class="hidden"><span id="combo-txt"></span><div class="cbar"><div id="combo-fill"></div></div></div></div>
    <div id="boss" class="hidden"><div id="boss-name"></div><div class="bar"><div class="fill" id="boss-fill"></div></div></div>
    <div id="objective" class="hidden"></div>
  </div>

  <div id="joy-outer"></div><div id="joy-base"></div><div id="joy-knob"></div>
  <div id="dev-panel" class="hidden"><div id="dev-stats"></div><div id="dev-buttons"></div></div>
  <div id="waypoint" class="hidden"></div>
  <div id="toast"></div>
  <div id="evo" class="hidden"><div class="evo-pair"><span id="evo-a"></span><i>+</i><span id="evo-b"></span></div><div class="evo-label">Связка</div><div id="evo-name"></div><div id="evo-desc"></div></div>
  <div id="wait" class="hidden"></div>
  <div id="countdown" class="hidden"></div>

  <div id="pause-ov" class="overlay hidden">
    <h2>Пауза</h2>
    <p id="pause-note"></p>
    <div id="pause-build" class="buildbox"></div>
    <div class="vtag" id="pause-version"></div>
    <div class="end-buttons"><button id="pause-resume">Продолжить</button><button id="pause-exit" class="secondary">Выйти в меню</button></div>
  </div>

  <div id="vote" class="hidden">
    <div id="vote-text"></div>
    <div class="bar"><div class="fill" id="vote-fill"></div></div>
    <div class="vote-buttons"><button id="vote-yes">Принять</button><button id="vote-no" class="secondary">Отклонить</button></div>
  </div>

  <div id="levelup" class="overlay hidden">
    <h2>Новый уровень</h2>
    <div class="cards" id="cards"></div>
    <div class="lu-actions"><button id="lu-reroll" class="secondary small">Другие карты</button><button id="lu-skip" class="secondary small">Пропустить · +20 HP</button></div>
    <div id="build"></div>
  </div>

  <div id="chest" class="overlay hidden">
    <div class="chest-stage">
      <div class="chest-rays"></div>
      <div class="chest-box"><i class="lid"></i><i class="body"></i></div>
      <div class="chest-card"><span class="icon" id="chest-icon"></span><div class="tag" id="chest-tag"></div><div class="name" id="chest-name"></div><div class="pips" id="chest-pips"></div><div class="desc" id="chest-desc"></div></div>
    </div>
    <div class="chest-hint" id="chest-hint">Коснись, чтобы забрать</div>
  </div>

  <div id="start" class="overlay menu">
    <a class="hub-back" href="../">← Все игры</a>
    <h1 id="title">Swipe <br>Survivors</h1>
    <div id="dev-info" class="hidden"></div>
    <div class="tips"><span>Взмах режет</span><span>Петля собирает опыт</span><span>Джойстик — в нижнем углу</span></div>

    <div id="menu-main" class="modes">
      <button class="mode" data-go="story"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5l8-2 8 2v15M4 20h16M12 3v17M9 12h1M14 12h1"/></svg></i><b>Сюжет</b><small>4 главы · прорыв</small></button>
      <button class="mode" data-go="survival"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 18 6M14 4h6v6M4 4l6 6M14 14l6 6M17 20h3v-3"/></svg></i><b>Выживание</b><small>10 волн · боссы</small></button>
      <button class="mode" data-go="coop"><i><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.5 20c.6-3.6 2.6-5.4 5.5-5.4s4.900 1.800 5.500 5.400M14.500 14.800c3.300-.700 6 1 6.800 5.200"/></svg></i><b>Кооп</b><small>По сети, по коду</small></button>
    </div>
    <div id="menu-sub" class="subrow">
      <button class="sub" data-go="shop">Мастерская <small id="bones-small" class="bones">0</small></button>
      <button class="sub" data-go="codex">Предметы</button>
      <button class="sub" data-go="ach">Ачивки <small id="ach-small"></small></button>
    </div>

    <div id="menu-codex" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Предметы</div>
      <div id="codex"></div>
    </div>

    <div id="menu-ach" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Ачивки</div>
      <div class="list" id="achs"></div>
    </div>

    <div id="menu-shop" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Мастерская <span id="bones" class="bones">0</span></div>
      <h3 class="shop-h">Клинок <small>меняет сам взмах</small></h3>
      <div class="list" id="blades"></div>
      <h3 class="shop-h">Закалка <small>постоянные прибавки</small></h3>
      <div class="list" id="shop"></div>
    </div>

    <div id="menu-story" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Сюжет</div>
      <div class="list" id="chapters"></div>
    </div>

    <div id="menu-survival" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Выживание</div>
      <div class="list" id="stages"></div>
    </div>

    <div id="menu-coop" class="panel hidden">
      <div class="panel-title"><button class="back">←</button>Кооп</div>
      <div class="coop">
        <div class="coop-row" id="coop-idle">
          <button id="coop-host">Создать комнату</button>
          <input id="coop-code" maxlength="5" placeholder="КОД" autocomplete="off" autocapitalize="characters" spellcheck="false" />
          <button id="coop-join" class="secondary">Войти</button>
        </div>
        <div id="coop-status" class="hidden"></div>
        <div class="list hidden" id="coop-choices"></div>
        <button id="coop-cancel" class="secondary small hidden">Отмена</button>
      </div>
    </div>

    <div id="update" class="hidden"></div>
    <div class="settings">
      <button id="set-sound" class="chip">Звук</button>
      <button id="set-music" class="chip">Музыка</button>
      <button id="set-gloomy" class="chip">Мрачный стиль</button>
      <button id="set-lefty" class="chip">Левша</button>
    </div>
    <div id="version"></div>
  </div>

  <div id="end" class="overlay hidden">
    <h2 id="end-title"></h2>
    <div id="end-stats"></div>
    <div class="end-buttons"><button id="end-primary"></button><button id="end-secondary" class="secondary"></button></div>
  </div>

  <script type="module" src="../src/main.ts"></script>
</body>
</html>
